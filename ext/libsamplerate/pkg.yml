pkg.name: ext/libsamplerate
pkg.description: samplerate library
pkg.author: "Apache Mynewt <dev@mynewt.apache.org>"
pkg.homepage: "http://mynewt.apache.org/"
pkg.keywords:
    - samplerate

pkg.build_profile: speed

pkg.type: sdk

pkg.cflags: -DHAVE_STDBOOL_H -fsingle-precision-constant -Wdouble-promotion -DHAVE_CONFIG_H -DNDEBUG -DLIBSAMPLERATE_SINGLE_PRECISION
#pkg.cflags:     -DHAVE_STDBOOL_H -fsingle-precision-constant -Wdouble-promotion
pkg.cflags.ENABLE_SINC_BEST_CONVERTER: -DENABLE_SINC_BEST_CONVERTER
pkg.cflags.ENABLE_SINC_MEDIUM_CONVERTER: -DENABLE_SINC_MEDIUM_CONVERTER
pkg.cflags.ENABLE_SINC_FAST_CONVERTER: -DENABLE_SINC_FAST_CONVERTER
pkg.cflags.LIBSAMPLER_NDEBUG: -DNDEBUG

pkg.lflags: -lm

app.cflags:
    - -DLIBSAMPLERATE_SINGLE_PRECISION

pkg.src_dirs:
    - "@libsamplerate/src"

pkg.include_dirs:
    - "@libsamplerate/include"

repository.libsamplerate:
    type: github
    vers: 533e7aae2f43509d6864784628d380078e36919b-commit
    branch: cc-double-to-float
    user: codecoup-ext
    repo: libsamplerate
